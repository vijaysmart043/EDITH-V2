[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EDITH"
version = "1.0.0"
description = "Enhanced Digital Intelligence & Task Handler - Windows AI Desktop Assistant"
authors = [{ name = "G.Vijay Raj (vijay smart)" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
edith = "main:main"
